<!-- popup/popup.html — PhishGuard Popup UI -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380, initial-scale=1.0">
  <title>PhishGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    🛡️ PhishGuard
    <a href="../options/options.html" id="settings" title="Settings" style="color:var(--safe);text-decoration:none;font-size:1.2rem;">⚙</a>
  </div>
  <div id="url"></div>
  <div id="verdict-container"></div>
  <div id="threat-bar">
    <div id="threat-bar-inner"></div>
  </div>
  <div class="section" id="ai-section"></div>
  <div class="section" id="vt-section"></div>
  <div class="section" id="gsb-section"></div>
  <div id="actions">
    <button id="rescan">🔄 Re-scan</button>
    <button id="trust">✅ Trust Site</button>
    <button id="report">📋 Full Report</button>
  </div>
  <div id="loading" style="display:none;">
    <svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" stroke="#00ff88" stroke-width="4" fill="none" stroke-dasharray="31.4 31.4"/></svg>
    <div>Scanning...</div>
  </div>
  <div id="error" style="display:none;"></div>
  <div id="unsupported" style="display:none;"></div>
  <script src="../utils/api.js" type="module"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
